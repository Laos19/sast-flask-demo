{% extends "base.html" %}
{% block contenido %}
  <h1>{{ titulo }}</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <input name="usuario" placeholder="Usuario" required>
    <input name="password" type="password" placeholder="Contraseña" required>
    <button type="submit">{{ titulo }}</button>
  </form>
{% endblock %}
